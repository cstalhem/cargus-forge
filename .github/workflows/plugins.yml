# Plugin checks for every PR, including sub-issue PRs into a feature branch. Branch
# protection requires them only on main. No path filters: a required check that a
# path filter skips never reports, and that blocks the PR.
name: plugins

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate each plugin and the marketplace root
        run: scripts/validate-plugins.sh

  descriptions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-descriptions.sh

  comments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-comments.sh

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Every tracked test file runs, so a new one needs no workflow edit.
      - name: Run every test file
        run: scripts/test.sh
